<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shaxsiy kabinet — AZA FLOWERS</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Roboto+Slab:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=30">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
</head>
<body>
<div class="topbar"><div class="container"><span class="lang"><a href="/" class="on">🇺🇿 Uzbek</a></span><span class="sp"></span><span class="promo">Har hafta eng yaxshi takliflar!</span></div></div>
<header class="header"><div class="container hmain">
<a class="logo" href="/"><img src="/static/logo.svg" alt="AZA"><span class="t"><b>AZA</b><small>FLOWERS • TASHKENT</small></span></a>
<nav class="c-top-menu"><a href="/">Bosh sahifa</a><a href="/#katalog">Katalog</a><a href="/about">Biz haqimizda</a><a href="/track">Kuzatish</a></nav>
<div class="hicons"><span id="authArea"></span></div>
</div></header>
<main class="container page" style="max-width:760px">
  <span class="eyebrow">Akkaunt</span>
  <h1>Mening buyurtmalarim</h1>
  <div id="myBox"></div>
</main>
<footer>
  <div class="container fgrid">
    <div><b class="fh">Xaridorga</b><div class="flinks"><a href="/#katalog">Katalog</a><a href="/track">Kuzatish</a></div></div>
    <div><b class="fh">Ma'lumot</b><div class="flinks"><a href="/about">Kontaktlar</a><a href="/about">To'lov va yetkazish</a></div></div>
    <div><b class="fh">Kontaktlar</b><div id="footContact"></div></div>
  </div>
  <div class="fbottom"><div class="container fbin"><span>© 2026 AZA FLOWERS. Barcha huquqlar himoyalangan.</span></div></div>
</footer>
<script src="/static/auth.js?v=20"></script>
<script>
const fmtC=n=>n.toLocaleString('uz-UZ').replace(/,/g,' ')+" so'm";
(async()=>{
  const box=document.getElementById('myBox');
  if(!Auth.token){
    box.innerHTML=`<div class="obox"><h3 style="font-family:var(--serif);font-size:26px;font-weight:400;margin-bottom:8px">Kirish talab qilinadi</h3><p style="color:var(--body)">Buyurtmalaringizni ko'rish uchun kiring.</p><div class="form"><input id="cPhone" placeholder="Telefon: +998 ..." inputmode="tel"><input id="cPass" type="password" placeholder="Parol"><button class="btn btn-acc" id="cGo" style="width:100%">Kirish →</button></div></div>`;
    document.getElementById('cGo').onclick=async()=>{
      const ph=document.getElementById('cPhone').value.trim(),pw=document.getElementById('cPass').value;
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph,password:pw})});
      const d=await r.json();
      if(!r.ok){box.insertAdjacentHTML('beforeend','<p class="hint">'+(d.detail||'Xatolik')+'</p>');return}
      Auth.save(d.token,d.user);location.reload();
    };
    return;
  }
  box.innerHTML='<div class="empty">Yuklanmoqda...</div>';
  const r=await fetch('/api/orders/mine',{headers:Auth.headers()});
  if(r.status===401){Auth.clear();location.reload();return}
  const orders=await r.json();
  if(!orders.length){box.innerHTML='<div class="empty">Hali buyurtmalaringiz yo\'q<br><a class="btn btn-acc" style="margin-top:12px;display:inline-block" href="/#katalog">Gul tanlash</a></div>';return}
  box.innerHTML=orders.map(o=>{
    const st=o.status==='qabul'?'<span class="st st-ok">Qabul qilingan</span>':'<span class="st st-new">Tayyorlanmoqda</span>';
    return `<div class="oline"><div><b>#${o.id}</b> ${st}<div style="color:var(--muted);font-size:13px">${o.created_at} • ${o.lines.map(l=>l.name+' × '+l.qty).join(', ')}</div></div><b>${fmtC(o.total)}</b></div>`;
  }).join('');
})();
</script>
</body></html>
